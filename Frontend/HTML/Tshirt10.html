<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Slideshow</title>
    <link href="../css/product.css" rel="stylesheet" />
</head>
<body>
  <!--  product images-->
    <div class="slideshow-container">
        <img class="slide" src="../image/tshirtshweta/tshirt10.jpg" height="400" alt="Image 1">
        <img class="slide" src="../image/tshirtshweta/tshirtback10.jpg" height="400" alt="Image 2">
        <img class="slide" src="../image/kurtisrushti/kurtiside1.jpg" heigh="400" alt="Image 3">
        <button class="prev" onclick="changeSlide(-1)">&#10094;</button>
        <button class="next" onclick="changeSlide(1)">&#10095;</button>
    </div>
    <hr class="bold-line" />
   <!-- name of the product-->
    <p class="proname"><b>silk tshirt</b></p>
  <!--  prize of the product-->
    <div class="headline">
        <b>PRIZE:</b>
    </div>
  <!--  prize of the product-->
    <div class="prize">
        <p>- Rs<del>500/-</del></p>
    </div>
   <!-- offer-->
    <div class="pr2">
        <b>- 25% off</b>
    </div>
    <div class="pr1">
        <b>- Only in Rs 250/-</b>
    </div><br />
  <!--  size of the product-->
    <div class="headline">
        <b>SIZE:</b>
    </div><br />
    <div class="choose">
        <select>
            <option>Size</option>
            <option>M</option>
            <option>XL</option>
            <option>XXL</option>
            <option>XXXL</option>
        </select>
    </div><br /><br />
  <!--  Rate for the product-->
    <div class="headline"><b>RATING:</b></div>
    <div class="rate">
        <h1>&#9733;</h1>
        <h1>&#9733;</h1>
        <h1>&#9733;</h1>
        <h1>&#9733;</h1>
        <h1>&#9733;</h1>
    </div>
 <!--   Add to cart and wishlist-->
    <div class="btnadd">
        <button type="button" class="sub1">Add To Cart</button>
        <button type="button" class="sub1">Add To Wishlist</button>
    </div>
    <script src="../js/kurti.js"></script>
</body>
</html>
