<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Form</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #e0f7fa;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .login-container {
            background-color: #ffffff;
            padding: 20px 30px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            width: 300px;
            text-align: center;
        }

        h2 {
            margin-bottom: 20px;
            color: #333;
        }

        .form-group {
            margin-bottom: 15px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: #555;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 14px;
        }

        button {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 5px;
            background-color: #00796b;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

            button:hover {
                background-color: #004d40;
            }

        #error-message {
            color: red;
            font-size: 14px;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <form id="loginForm">
            <h2>Login</h2>
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="user-name" name="username" placeholder="Enter your username" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter your password" required>
            </div>
            <div class="form-group">
                <button type="submit">Login</button>
            </div>
            <p id="error-message"></p>
        </form>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function (event) {
            event.preventDefault();
    
            const username = document.getElementById('user-name').value.trim();
            const password = document.getElementById('password').value.trim();
            const errorMessage = document.getElementById('error-message');
    
            // Validate input fields
            if (username === '' || password === '') {
                errorMessage.textContent = 'Please fill out all fields.';
                return;
            }
    
            // Construct the login payload
            const loginData = {
                username: username,
                password: password
            };
    
            // Send the login request to the backend
            fetch('http://localhost:8080/api/login', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(loginData)
            })
                .then(response => {
                    if (!response.ok) {
                        // Handle HTTP errors
                        if (response.status === 401) {
                            throw new Error('Incorrect username or password.');
                        } else {
                            throw new Error('An error occurred. Please try again later.');
                        }
                    }
                    return response.json();
                })
                .then(data => {
                    // Assuming the backend sends a token upon successful login
                    alert('Login successful!');
    
                    // Store the token in localStorage or sessionStorage for future requests
                    localStorage.setItem('authToken', data.token);
    
                    // Redirect to the dashboard or home page
                    window.location.href = 'mainproject.html';
                })
                .catch(error => {
                    console.error('Error:', error);
                    errorMessage.textContent = error.message;
                });
        });
    </script>
    
</body>
</html>
