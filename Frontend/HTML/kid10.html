<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Slideshow</title>
    <link href="../css/product.css" rel="stylesheet" />
</head>
<body>
    <div class="slideshow-container">
        <img class="slide" src="../image/kids/kidleft10.jpg" height="400" alt="Image 3" />
        <img class="slide" src="../image/kids/kid10.jpg" height="400" alt="Image 1">
        <img class="slide" src="../image/kids/kidback10.jpg" height="400" alt="Image 2" />
        <button class="prev" onclick="changeSlide(-1)">&#10094;</button>
        <button class="next" onclick="changeSlide(1)">&#10095;</button>
    </div><hr class="bold-line" />
    <p class="proname"><b>Fashionable kid suit</b></p>
    <div class="headline">
        <b>PRIZE:</b>
    </div>
    <div class="prize">
        <p>- Rs<del>500/-</del></p>
    </div>
    <div class="pr2">
        <b>- 25% off</b>
    </div>
    <div class="pr1">
        <b>- Only in Rs 350/-</b>
    </div><br />
    <div class="headline">
        <b>SIZE:</b>
    </div><br />
    <div class="choose">
        <select>
            <option>Size</option>
            <option>M</option>
            <option>XL</option>
            <option>XXL</option>
            <option>XXL</option>
        </select>
    </div><br /><br />
    <div class="headline"><b>RATING:</b></div>
    <div class="rate">
        <h1>&#9733;</h1>
        <h1>&#9733;</h1>
        <h1>&#9733;</h1>
        <h1>&#9733;</h1>
        <h1>&#9733;</h1>
    </div>
    <div class="btnadd">
        <button type="button" class="sub1">Add To Cart</button>
        <button type="button" class="sub1">Add To Wishlist</button>
    </div>
    <script src="../js/kurti.js"></script>
</body>
</html>
